{% extends "base.html" %}

{% block title %}Setup Owner Account — StockWise{% endblock %}
{% block page_title %}Initial Store Setup{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 40px auto;">
  <div class="form-card" style="padding: 32px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <span class="badge badge-success" style="margin-bottom: 8px;">Initial Setup</span>
      <h2 style="font-size: 1.4rem;">Create Store Owner Account</h2>
      <p style="font-size: 13px;">Set up the primary administrative credentials for your store.</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="e.g. owner">
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Sarah Jenkins">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="owner@store.com">
      </div>

      <div class="form-group">
        <label for="password">Master Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">
        Initialize Owner Account
      </button>
    </form>
  </div>
</div>
{% endblock %}
